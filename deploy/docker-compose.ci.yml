# Local CI-style stack validation (postgres only exposed for integration tests).
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ardm
      POSTGRES_PASSWORD: ardmtest
      POSTGRES_DB: ardm_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ardm"]
      interval: 5s
      timeout: 3s
      retries: 10
