name: CI

on:
  push:
    branches: [main, "cursor/**"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ardm
          POSTGRES_PASSWORD: ardmtest
          POSTGRES_DB: ardm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ardm"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt
      - name: Unit tests
        run: cd backend && pytest -q tests/test_security.py tests/test_sms_hmac.py
      - name: Integration tests
        env:
          RUN_INTEGRATION: "1"
          TEST_DATABASE_URL: postgresql+asyncpg://ardm:ardmtest@127.0.0.1:5432/ardm_test
        run: cd backend && pytest -q tests/integration/

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: cd frontend && npm ci && npm run build

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Configure SDK path
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties
      - name: Gradle assembleDebug
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug test --stacktrace
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ardm-agent-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
